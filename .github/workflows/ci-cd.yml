name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  client-build-and-lint:
    name: Client - Build and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        continue-on-error: true # Prevent lint warnings from completely blocking the pipeline
        
      - name: Build
        run: npm run build

  services-install:
    name: Services - Dependency Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, status-update-service, websocket-service]
    defaults:
      run:
        working-directory: ./services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './services/${{ matrix.service }}/package-lock.json'
          
      - name: Install dependencies
        run: npm ci

  docker-build:
    name: Docker - Build Images
    needs: [services-install]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, status-update-service, websocket-service]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
