name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-services:
    name: Test and Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, status-update-service, websocket-service, client]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
        
    - name: Install dependencies
      working-directory: ${{ matrix.service == 'client' && './client' || format('./services/{0}', matrix.service) }}
      run: npm ci

    - name: Lint
      working-directory: ${{ matrix.service == 'client' && './client' || format('./services/{0}', matrix.service) }}
      run: |
        if npm run | grep -q " lint$"; then
          npm run lint
        else
          echo "No lint script found, skipping"
        fi

    - name: Test
      working-directory: ${{ matrix.service == 'client' && './client' || format('./services/{0}', matrix.service) }}
      run: |
        if npm run | grep -q " test$"; then
          npm run test --passWithNoTests
        else
          echo "No test script found, skipping"
        fi

  docker-build-validation:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: test-services
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        service: [order-service, status-update-service, websocket-service, client]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service == 'client' && './client' || format('./services/{0}', matrix.service) }}
        file: ${{ matrix.service == 'client' && './client/Dockerfile' || format('./services/{0}/Dockerfile', matrix.service) }}
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
