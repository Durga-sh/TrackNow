version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tracknow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - tracknow-network

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tracknow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - tracknow-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tracknow-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - tracknow-network

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: tracknow-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tracknow
    volumes:
      - mongodb-data:/data/db
    networks:
      - tracknow-network

  # Order Service
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: tracknow-order-service
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongodb:27017/tracknow
    depends_on:
      - kafka
      - redis
      - mongodb
    volumes:
      - ./services/order-service:/app
      - /app/node_modules
    networks:
      - tracknow-network

  # Status Update Service
  status-update-service:
    build:
      context: ./services/status-update-service
      dockerfile: Dockerfile
    container_name: tracknow-status-update-service
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongodb:27017/tracknow
    depends_on:
      - kafka
      - redis
      - mongodb
    volumes:
      - ./services/status-update-service:/app
      - /app/node_modules
    networks:
      - tracknow-network

  # WebSocket Service
  websocket-service:
    build:
      context: ./services/websocket-service
      dockerfile: Dockerfile
    container_name: tracknow-websocket-service
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
      - redis
    volumes:
      - ./services/websocket-service:/app
      - /app/node_modules
    networks:
      - tracknow-network

  # Frontend Client
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tracknow-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_ORDER_SERVICE_URL=http://localhost:3001
      - REACT_APP_STATUS_SERVICE_URL=http://localhost:3002
      - REACT_APP_WS_URL=ws://localhost:8080
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - tracknow-network

networks:
  tracknow-network:
    driver: bridge

volumes:
  redis-data:
  mongodb-data:
