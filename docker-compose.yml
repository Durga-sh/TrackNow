version: '3.8'

services:
  # ========================
  # Infrastructure
  # ========================
  mongo:
    image: mongo:7
    container_name: tracknow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tracknow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tracknow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tracknow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tracknow-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tracknow-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tracknow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - tracknow-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ========================
  # Application Services
  # ========================
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: tracknow-order-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:29092
      KAFKA_CLIENT_ID: order-service
      MONGO_URI: mongodb://mongo:27017/trackNow
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tracknow-network
    restart: unless-stopped

  status-update-service:
    build:
      context: ./services/status-update-service
      dockerfile: Dockerfile
    container_name: tracknow-status-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:29092
      KAFKA_CLIENT_ID: status-update-service
      MONGO_URI: mongodb://mongo:27017/trackNow
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tracknow-network
    restart: unless-stopped

  websocket-service:
    build:
      context: ./services/websocket-service
      dockerfile: Dockerfile
    container_name: tracknow-websocket-service
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:29092
      KAFKA_CLIENT_ID: websocket-service
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tracknow-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: tracknow-notification-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      KAFKA_BROKER: kafka:29092
      KAFKA_CLIENT_ID: notification-service
      MONGO_URI: mongodb://mongo:27017/trackNow
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: noreply@tracknow.app
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tracknow-network
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:

networks:
  tracknow-network:
    driver: bridge
